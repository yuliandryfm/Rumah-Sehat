# Kebijakan cargo-deny 0.21.0 untuk workspace Ruang Sehat (F1-T06; docs/05-stack.md §3.2, §6;
# docs/coding-standards.md §9; ADR-021 butir 4). Dijalankan scripts/verify.sh: `cargo deny --locked check`.
# Kunci konfigurasi diverifikasi ke dokumentasi resmi cargo-deny (SRC-362) dan diuji dengan cargo-deny 0.21.0.
#
# Pengecualian (ignore advisory, exception lisensi, sumber tambahan) hanya lewat berkas ini dengan alasan
# tertulis dan review keamanan. Advisory yang diabaikan di sini juga harus diabaikan di cargo-audit, yang
# dijalankan verify.sh dengan tingkat ketat yang sama; `.cargo/audit.toml` saat ini ditolak verify.sh, jadi
# pengecualian cargo-audit memerlukan perubahan scripts/verify.sh (persetujuan user).

[graph]
# Periksa graf dengan semua fitur aktif supaya dependensi di balik fitur opsional ikut diperiksa.
all-features = true

[advisories]
# Basis data default: RustSec advisory-db (diambil ulang setiap verifikasi; tanpa --offline).
yanked = "deny"
unmaintained = "all"
unsound = "all"
unused-ignored-advisory = "deny"
ignore = []

[licenses]
# Daftar izin awal docs/coding-standards.md §9.1 (KEPUTUSAN-136), ditambah Unicode-3.0 dan Zlib secara
# global (KEPUTUSAN-282, user 2026-11-20; pemicu: sqlx 0.9.1 menarik icu_*/unicode-normalization/
# unicode-properties dan foldhash, SRC-493). Pengecualian sempit unicode-ident (KEPUTUSAN-245) kini tercakup
# sehingga dihapus. Lisensi lain, termasuk ekspresi gabungan yang memuat lisensi di luar daftar ini, dibawa
# ke user sebelum ditambahkan.
# BSL-1.0 (Boost Software License 1.0) diizinkan global oleh user (KEPUTUSAN-287, 2026-11-20; pemicu:
# redis 1.8.2 menarik xxhash-rust 0.8.21 berlisensi BSL-1.0 sebagai dependensi wajib, SRC-571).
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "BSL-1.0"]
confidence-threshold = 0.8
# Dependensi pengembangan ikut diperiksa (lebih ketat dari default).
include-dev = true
# Daftar izin adalah kebijakan, bukan inventaris: lisensi yang belum dipakai tidak dilaporkan.
unused-allowed-license = "allow"
exceptions = []

[licenses.private]
# Crate workspace dengan `publish = false` tidak diperiksa lisensinya (kode milik proyek, tidak diterbitkan).
# Crate workspace tanpa `publish = false` tetap diperiksa terhadap daftar izin di atas.
ignore = true
registries = []

[bans]
multiple-versions = "warn"
# Dependensi versi `*` ditolak; dependensi path antar-crate workspace privat diizinkan.
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
# Hanya registry crates.io; registry lain dan dependensi git ditolak.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
