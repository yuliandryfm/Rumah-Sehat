[package]
name = "status-flow"
version = "0.1.0"
edition = "2024"
publish = false

# Pustaka jalur tulis status bersama (ADR-008 butir 2-3 dan konsekuensi "dibuat sekali sebagai pustaka di
# reference implementation", coding-standards §5.2, §11; F1-T59). Tanpa dependensi produksi: SQL milik
# repository modul pemilik tabel (coding-standards §1.3), pustaka ini hanya urutan langkah dan keputusannya.
[dependencies]

[dev-dependencies]
# tokio 1.54.1 sudah ada di Cargo.lock (docs/05-stack.md §1.1 [SRC-162]); hanya untuk unit test async.
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "macros"] }

# Lint larangan ada di [workspace.lints] dan clippy.toml root (F1-T12, coding-standards §3.4).
[lints]
workspace = true
