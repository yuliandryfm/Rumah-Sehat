[package]
name = "crypto"
version = "0.1.0"
edition = "2024"
publish = false

# Pustaka kripto tunggal (T1, ADR-013, KEPUTUSAN-74, KEPUTUSAN-129): hanya crate ini yang boleh
# bergantung langsung pada aws-lc-rs (diperiksa test arsitektur).
# Versi dipin persis untuk pustaka kriptografi (KEPUTUSAN-137):
# - aws-lc-rs 1.19.0 (docs/05-stack.md §1.1, [SRC-173]); API yang dipakai diverifikasi ke source 1.19.0 [SRC-480];
#   fitur bawaan dimatikan (tanpa ring-io/ring-sig-verify/untrusted), hanya backend non-FIPS aws-lc-sys
#   0.47.0 [SRC-481] dan `alloc`.
# - zeroize 1.9.2 [SRC-482]: menghapus salinan DEK dan plaintext di memori saat dibuang.
# Klien OpenBao (F1-T27): hyper 1.12.0 klien HTTP/1 + hyper-util 0.1.21 (TokioIo) + http-body-util 0.1.5
# + bytes 1.12.2 [SRC-484]; base64 0.23.1 [SRC-483]; http 1.5.0 [SRC-334]; tokio 1.54.1 [SRC-162];
# serde 1.0.229 [SRC-167]; serde_json 1.0.154 [SRC-335]; time 0.3.55 [SRC-177]. reqwest (stack §1.1)
# tidak dipakai di sini karena pohon dependensinya membawa lisensi di luar daftar izin deny.toml [SRC-489].
[dependencies]
foundation = { path = "../foundation" }
aws-lc-rs = { version = "=1.19.0", default-features = false, features = ["aws-lc-sys", "alloc"] }
zeroize = { version = "=1.9.2", default-features = false, features = ["alloc"] }
base64 = { version = "=0.23.1", default-features = false, features = ["alloc"] }
bytes = { version = "=1.12.2", default-features = false, features = ["std"] }
http = "=1.5.0"
http-body-util = { version = "=0.1.5", default-features = false }
hyper = { version = "=1.12.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }
time = { version = "=0.3.55", default-features = false, features = ["std"] }
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "net", "time"] }

[dev-dependencies]
time = { version = "=0.3.55", default-features = false, features = ["std", "macros"] }
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "net", "time", "process"] }

# Lint larangan ada di [workspace.lints] dan clippy.toml root (F1-T12, coding-standards §3.4).
[lints]
workspace = true
