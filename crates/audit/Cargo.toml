[package]
name = "audit"
version = "0.1.0"
edition = "2024"
publish = false

# Pustaka audit trail tunggal Ruang Sehat dan RME (ADR-009 butir 1), modul kritis T1.
# Versi: docs/05-stack.md §1.1 (serde 1.0.229 [SRC-167]; time 0.3.55 [SRC-177]); serde_json 1.0.154 [SRC-335].
[dependencies]
foundation = { path = "../foundation" }
observability = { path = "../observability" }
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }
time = { version = "=0.3.55", default-features = false, features = ["std", "formatting"] }

[dev-dependencies]
time = { version = "=0.3.55", default-features = false, features = ["std", "formatting", "macros"] }

# Lint larangan ada di [workspace.lints] dan clippy.toml root (F1-T12, coding-standards §3.4).
[lints]
workspace = true
