allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
disallowed-methods = [
  { path = "time::OffsetDateTime::now_utc", reason = "pakai trait Clock; hanya SystemClock yang boleh (KEPUTUSAN-131)" },
  { path = "std::time::SystemTime::now", reason = "pakai trait Clock (KEPUTUSAN-131)" },
  # Variabel lingkungan hanya dibaca di EnvSource::from_process (KEPUTUSAN-132).
  { path = "std::env::var", reason = "konfigurasi lewat EnvSource/struct bertipe (KEPUTUSAN-132)" },
  { path = "std::env::var_os", reason = "konfigurasi lewat EnvSource/struct bertipe (KEPUTUSAN-132)" },
  { path = "std::env::vars", reason = "konfigurasi lewat EnvSource/struct bertipe (KEPUTUSAN-132)" },
  { path = "std::env::vars_os", reason = "konfigurasi lewat EnvSource/struct bertipe (KEPUTUSAN-132)" },
]
