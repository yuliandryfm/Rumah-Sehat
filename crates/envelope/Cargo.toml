[package]
name = "envelope"
version = "0.1.0"
edition = "2024"
publish = false

# Versi dan fitur: serde 1.0.229 (docs/05-stack.md §1.1, [SRC-167]); http 1.5.0 [SRC-334]; serde_json 1.0.154 [SRC-335].
[dependencies]
foundation = { path = "../foundation" }
http = "=1.5.0"
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }

[dev-dependencies]
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }

# Lint larangan ada di [workspace.lints] dan clippy.toml root (F1-T12, coding-standards §3.4).
[lints]
workspace = true
