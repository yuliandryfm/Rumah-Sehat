# Inventaris pemancar event audit dan test kelengkapannya (F1-T69, US-1501 AC1–AC2, PRD §7.1–§7.3).
#
# Dijaga aturan arch-check `audit-coverage` (crates/arch-check/src/audit_coverage.rs, langkah
# "test-arsitektur" di scripts/verify.sh). Setiap berkas kode non-test yang menyebut `EventCode::Exx` atau
# memanggil `AuditEvent::new` wajib punya entri di sini dengan kode event yang disebutnya persis, dan
# minimal satu test integrasi yang membaca payload tersimpan lalu memanggil salah satu `checkers`
# (semuanya bermuara di `audit::check_payload`). Event baru tanpa entri = verifikasi merah.
#
# Kelengkapan per cabang pemancar juga ditegakkan saat runtime: `AuditEvent::finish` menjalankan
# `check_payload` dan menolak event yang kurang field wajib untuk kodenya, sehingga aksi pemanggil batal
# (ADR-009 butir 2, KEPUTUSAN-15).

# assert_event_complete / assert_events_complete: apps/rs-backend/tests/audit_support/mod.rs
# audit_events, audit_events_for_object: apps/rs-backend/tests/identity_support/mod.rs (memeriksa semua payload
# outbox sebelum relay; varian kedua memilih event menurut objek, untuk event hasil gagal tanpa subjek)
# e05_events: apps/rs-backend/tests/platform_files_download.rs (idem)
checkers = ["assert_event_complete", "assert_events_complete", "audit_events", "audit_events_for_object", "e05_events"]

# E-05 hasil gagal atas penerima layanan milik pasien lain (F1-T38, KU-03).
