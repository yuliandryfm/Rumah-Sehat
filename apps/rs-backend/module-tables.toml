# Kepemilikan tabel per modul backend Ruang Sehat (coding-standards §1.3, KEPUTUSAN-113).
# Diperiksa test arsitektur (crates/arch-check): SQL di kode suatu modul hanya boleh menyentuh tabel
# milik modul itu; tabel yang dibuat migrasi di db/migrations/<database>/ wajib punya pemilik di sini.
# Nama tabel tanpa awalan skema. Pemetaan modul mengikuti docs/04-arsitektur.md §3 dan area
# docs/04-data-dictionary.md (A1 identitas, A2 profil, A3 privasi, A19 platform). Tabel area lain ditambahkan
# oleh task migrasinya (F1-T16 dan seterusnya) pada commit yang sama dengan migrasinya.
database = "app"

[modules.identity]
tables = ["account", "rs_admin_role", "session_revocation"]

[modules.profile]
tables = [
  "patient",
  "care_recipient",
  "address",
  "identity_document",
  "identity_verification_request",
  "identity_verification_request_status_event",
  "identity_verification_request_state",
  "account_owner_nik_registry",
]

# A3 persetujuan (F1-T19): modul Privasi menurut docs/04-arsitektur.md §3.
[modules.privacy]
tables = ["consent_text_version", "consent_item", "consent_record"]

# A15.4 konten CMS (F1-T91): modul "Konten dan layanan pelanggan" (docs/04-arsitektur.md §3; kode modul 11).
[modules.content_support]
tables = ["cms_content"]

# reason_code (A6.7): data rujukan lintas modul tanpa pemetaan eksplisit di docs/04-arsitektur.md §3;
# dimiliki platform (F1-T18), modul lain membacanya lewat api platform.
[modules.platform]
tables = ["upload_slot", "stored_file", "reason_code"]

# Pengecualian yang sah (coding-standards §1.3): tabel milik crate bersama, hanya ditulis lewat crate itu.
[crates.audit]
tables = ["audit_outbox"]

# Tabel database audit (DD B1-B6; db/migrations/audit, bukan database `app` di atas) hanya diakses lewat
# crate audit-store (F1-T24): makronya dicek terhadap database audit (crates/audit-store/sqlx.toml).
# audit_archive_manifest belum diakses kode (prosedur arsip §6.5 milik pemilik skema).
[crates.audit-store]
tables = ["audit_event", "audit_event_subject", "audit_event_key", "audit_chain_anchor", "audit_chain_verification"]

[crates.crypto]
tables = ["data_key", "data_key_retention_anchor"]

# Antrean job (A19.4) hanya lewat crate platform-jobs (F1-T20; coding-standards §1.3 "tabel job ... lewat
# platform-jobs"); modul platform dan modul lain memakai API crate itu.
[crates.platform-jobs]
tables = ["job"]
