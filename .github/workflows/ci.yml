# CI Ruang Sehat (F1-T06; docs/05-stack.md §3.1–§3.2, §6; ADR-021 butir 4; KEPUTUSAN-81, KEPUTUSAN-82).
# Memverifikasi ulang di runner GitHub-hosted yang bersih: scripts/verify.sh lengkap (Rust, cargo-deny,
# cargo-audit, gitleaks, osv-scanner, dan langkah lain begitu diterapkan) lalu test skrip verifikasi itu sendiri.
#
# Aturan workflow ini:
# - Setiap action dipin ke SHA commit penuh dari repo resmi action, dengan tag sebagai komentar (SRC-354, SRC-355).
# - Alat dipasang dari rilis resmi dengan versi persis dan pemeriksaan SHA-256 (scripts/ci/pasang-alat.sh).
# - GITHUB_TOKEN hanya baca isi repo; tidak ada secret, tidak ada pull_request_target (SRC-355, SRC-356).
# - Tanpa cache: setiap jalan dimulai dari runner bersih supaya konfigurasi lokal tidak terbawa.

name: CI

on:
  push:
  pull_request:
    branches: [main]
  # Harian 23:00 UTC (06:00 WIB) di branch default: advisory baru terdeteksi walau tidak ada commit
  # (review F1-T06, non-blokir 4).
  schedule:
    - cron: "0 23 * * *"

permissions:
  contents: read

# KEPUTUSAN-392 (N-2): grup memuat jenis event supaya run terjadwal tidak dibatalkan oleh push ke ref yang sama;
# run di main tidak pernah dibatalkan (setiap commit main tetap punya hasil lengkap), cabang lain membatalkan
# run lama yang sudah usang. `push` sengaja tidak dibatasi ke cabang tertentu: cabang kerja digabung ke
# tahap-08-fase-1 tanpa PR (PR hanya ke main), jadi push adalah satu-satunya pemicu CI untuk cabang itu; pembatasan
# akan membuat cabang tanpa PR tidak terverifikasi di runner bersih. Cabang yang punya PR ke main memang dijalankan
# dua kali (push dan pull_request); itu biaya yang diterima, dibatalkan otomatis bila ada push berikutnya.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: verify.sh (lingkungan bersih)
    runs-on: ubuntu-24.04
    # Run nyata terakhir: verify.sh lengkap sekitar 24 menit di runner bersih (data: docs/05-stack.md §3.2).
    # Test perilaku verify.sh (fixture) dipindah ke job test-verify (matrix per kelompok, KEPUTUSAN-340).
    timeout-minutes: 60
    steps:
      - name: Checkout (riwayat penuh untuk gitleaks dan basis migrasi)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # scripts/db-migrations-check.sh mencari basis lewat `git merge-base HEAD main` atau
      # `tahap-08-fase-1` (ref lokal). Checkout hanya membuat branch lokal untuk ref yang dibangun; branch
      # lain tersedia sebagai origin/<nama>, jadi dibuatkan branch lokal (tanpa jaringan).
      - name: Siapkan ref basis migrasi (main, tahap-08-fase-1)
        run: |
          for b in main tahap-08-fase-1; do
            if ! git show-ref --verify --quiet "refs/heads/$b" && git show-ref --verify --quiet "refs/remotes/origin/$b"; then
              git branch "$b" "origin/$b"
            fi
          done
          git branch --list main tahap-08-fase-1

      - name: Pasang toolchain Rust sesuai rust-toolchain.toml
        run: |
          channel="$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | sed -n '1p')"
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy --no-self-update
          rustc --version

      - name: Pasang alat pemindai (versi persis, SHA-256 diperiksa)
        run: |
          bash scripts/ci/pasang-alat.sh "$RUNNER_TEMP/alat-ci"
          echo "$RUNNER_TEMP/alat-ci" >> "$GITHUB_PATH"

      # sqlx-cli 0.9.1 (SRC-182) untuk langkah migrasi-db, di lokasi yang dicari scripts/db-migrations-check.sh.
      # --locked memakai Cargo.lock rilis; setiap crate diperiksa checksum-nya terhadap indeks crates.io.
      - name: Pasang sqlx-cli 0.9.1 (crates.io, --locked)
        run: |
          root="$HOME/.local/share/ruang-sehat/sqlx-cli-0.9.1"
          cargo install sqlx-cli --version 0.9.1 --locked --no-default-features --features postgres,rustls --root "$root"
          test "$("$root/bin/sqlx" --version | sed -n '1p')" = "sqlx-cli 0.9.1"

      # Langkah bootstrap-role-db dan migrasi-db (kontainer PostgreSQL sekali pakai) serta schemathesis (image
      # Docker dengan --network host) di verify.sh butuh Docker. Docker Engine sudah terpasang di image
      # ubuntu-24.04 (SRC-357); di sini dipastikan daemon berjalan sebelum verify.sh.
      - name: Periksa Docker tersedia (bootstrap-role-db, migrasi-db, schemathesis)
        run: |
          docker version
          docker info --format '{{.OperatingSystem}} {{.ServerVersion}}'

      # Langkah web verify.sh butuh Node 26 dan pnpm persis sama dengan packageManager di web/package.json
      # (docs/05-stack.md §1.2: Node v26.13.1 SRC-107, pnpm 12.21.0 SRC-113). setup-node v7.1.0 dipin SHA
      # commit tag resmi (SRC-853); tanpa cache paket (package-manager-cache: false), sesuai aturan workflow.
      # pnpm dari registry npm dengan versi persis; npm memeriksa integritas sha512 tarball dari metadata registry.
      - name: Pasang Node.js 26.13.1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
          package-manager-cache: false

      - name: Pasang pnpm 12.21.0 (registry npm, versi persis)
        run: |
          npm install --global pnpm@12.21.0
          test "$(node --version)" = "v26.13.1"
          test "$(cd web && pnpm --version)" = "12.21.0"

      - name: Test unit penyaringan kelas sidik cache verify.sh (KEPUTUSAN-301)
        run: bash scripts/test/test-verify-sidik.sh

      # KEPUTUSAN-340: gabungan kelompok matrix = seluruh fixture test-verify.sh, dan daftar kelompok di matrix
      # job test-verify di bawah = daftar kelompok skrip. Fixture atau kelompok yang terlewat membuat langkah ini merah.
      - name: Test kelengkapan kelompok fixture test-verify.sh (KEPUTUSAN-340)
        run: bash scripts/test/test-verify-kelompok.sh

      - name: Periksa tidak ada konfigurasi cargo di luar repo
        run: bash scripts/ci/periksa-lingkungan-bersih.sh

      # KEPUTUSAN-301: CI selalu tanpa cache sidik. verify.sh sudah mematikan cache bila CI/GITHUB_ACTIONS
      # diset (keduanya diset GitHub Actions, SRC-795); RS_VERIFY_TANPA_CACHE ditambahkan eksplisit.
      - name: scripts/verify.sh
        env:
          RS_VERIFY_TANPA_CACHE: "1"
        run: bash scripts/verify.sh

  # KEPUTUSAN-340 (CR-029): test-verify.sh menjalankan verify.sh lengkap untuk hampir setiap fixture (puluhan pemanggilan;
  # satu fixture pertama di runner bersih sekitar 23 menit, fixture berikutnya belasan menit), jadi satu job
  # tidak muat dalam batas waktu. Fixture dibagi ke kelompok (kelompok_blok di scripts/test/test-verify.sh,
  # satu fixture penuh per kelompok, kecuali pasangan yang murah) dan dijalankan sebagai job matrix paralel di runner standar GitHub
  # (ubuntu-24.04, bukan larger runner berbayar). fail-fast mati supaya semua kelompok terlapor, bukan hanya yang
  # pertama merah. Batas waktu job tetap 60 menit (KEPUTUSAN-395); ukuran kelompok yang diperkecil, bukan batasnya
  # dinaikkan. Job terpanjang terukur 48,5 menit (run 46013122998); mendekati 54 menit (TD-54 b) minta keputusan user.
  # Daftar kelompok di bawah dijaga sama dengan skrip oleh scripts/test/test-verify-kelompok.sh (job verify).
  test-verify:
    name: test-verify.sh (${{ matrix.kelompok }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        kelompok:
          - cache-isi
          - cache-ci
          - cache-batal
          - cache-merah
          - cache-gagal
          - cache-penuh
          - cache-tanpa-rujukan
          - dasar
          - hook-test
          - lisensi-rentan
          - web-a
          - clippy
          - env-rustflags
          - env-gitleaks
          - cargo-config
          - fmt
          - gitleaks-riwayat
          - gitleaks-staged
          - gitleaks-unstaged
          - gitleaks-allow
          - gitleaks-config-liar
          - gitleaks-config-hilang
          - osv-config-liar
          - audit-toml
          - lockfile-asing
          - deny-hilang
          - alat-hilang
          - alat-versi
          - web-kontras
          - migrasi
    steps:
      - name: Checkout (riwayat penuh untuk gitleaks dan basis migrasi)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # scripts/db-migrations-check.sh mencari basis lewat `git merge-base HEAD main` atau
      # `tahap-08-fase-1` (ref lokal). Checkout hanya membuat branch lokal untuk ref yang dibangun; branch
      # lain tersedia sebagai origin/<nama>, jadi dibuatkan branch lokal (tanpa jaringan).
      - name: Siapkan ref basis migrasi (main, tahap-08-fase-1)
        run: |
          for b in main tahap-08-fase-1; do
            if ! git show-ref --verify --quiet "refs/heads/$b" && git show-ref --verify --quiet "refs/remotes/origin/$b"; then
              git branch "$b" "origin/$b"
            fi
          done
          git branch --list main tahap-08-fase-1

      - name: Pasang toolchain Rust sesuai rust-toolchain.toml
        run: |
          channel="$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | sed -n '1p')"
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy --no-self-update
          rustc --version

      - name: Pasang alat pemindai (versi persis, SHA-256 diperiksa)
        run: |
          bash scripts/ci/pasang-alat.sh "$RUNNER_TEMP/alat-ci"
          echo "$RUNNER_TEMP/alat-ci" >> "$GITHUB_PATH"

      # sqlx-cli 0.9.1 (SRC-182) untuk langkah migrasi-db, di lokasi yang dicari scripts/db-migrations-check.sh.
      # --locked memakai Cargo.lock rilis; setiap crate diperiksa checksum-nya terhadap indeks crates.io.
      - name: Pasang sqlx-cli 0.9.1 (crates.io, --locked)
        run: |
          root="$HOME/.local/share/ruang-sehat/sqlx-cli-0.9.1"
          cargo install sqlx-cli --version 0.9.1 --locked --no-default-features --features postgres,rustls --root "$root"
          test "$("$root/bin/sqlx" --version | sed -n '1p')" = "sqlx-cli 0.9.1"

      # Langkah bootstrap-role-db dan migrasi-db (kontainer PostgreSQL sekali pakai) serta schemathesis (image
      # Docker dengan --network host) di verify.sh butuh Docker. Docker Engine sudah terpasang di image
      # ubuntu-24.04 (SRC-357); di sini dipastikan daemon berjalan sebelum verify.sh.
      - name: Periksa Docker tersedia (bootstrap-role-db, migrasi-db, schemathesis)
        run: |
          docker version
          docker info --format '{{.OperatingSystem}} {{.ServerVersion}}'

      # Langkah web verify.sh butuh Node 26 dan pnpm persis sama dengan packageManager di web/package.json
      # (docs/05-stack.md §1.2: Node v26.13.1 SRC-107, pnpm 12.21.0 SRC-113). setup-node v7.1.0 dipin SHA
      # commit tag resmi (SRC-853); tanpa cache paket (package-manager-cache: false), sesuai aturan workflow.
      # pnpm dari registry npm dengan versi persis; npm memeriksa integritas sha512 tarball dari metadata registry.
      - name: Pasang Node.js 26.13.1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
          package-manager-cache: false

      - name: Pasang pnpm 12.21.0 (registry npm, versi persis)
        run: |
          npm install --global pnpm@12.21.0
          test "$(node --version)" = "v26.13.1"
          test "$(cd web && pnpm --version)" = "12.21.0"

      - name: Periksa tidak ada konfigurasi cargo di luar repo
        run: bash scripts/ci/periksa-lingkungan-bersih.sh

      - name: Test skrip verifikasi, kelompok ${{ matrix.kelompok }} (fixture merah harus MERAH)
        env:
          RS_TEST_VERIFY_KELOMPOK: ${{ matrix.kelompok }}
        run: bash scripts/test/test-verify.sh

  # KEPUTUSAN-391 (N-1): satu pemeriksaan agregat untuk matrix. Required check cukup `verify` dan `test-verify-hasil`;
  # daftar kelompok matrix tidak perlu disalin ke setelan branch protection. `if: always()` supaya job ini tetap
  # jalan dan MERAH (bukan "skipped", yang dapat dianggap lolos) bila ada kelompok gagal, dibatalkan, atau dilewati.
  test-verify-hasil:
    name: test-verify-hasil
    runs-on: ubuntu-24.04
    needs: [test-verify]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Semua kelompok matrix test-verify harus success
        env:
          HASIL_MATRIX: ${{ needs.test-verify.result }}
        run: test "$HASIL_MATRIX" = success

  # KEPUTUSAN-450 (user Q11 = B, TD-48 a): test penetralan PDF dengan qpdf asli
  # (apps/rs-backend/tests/corporate_documents_pdf_qpdf.rs, bertanda #[ignore] di lokal) dijalankan di CI dengan
  # paket Ubuntu `qpdf`. Job terpisah supaya job `verify` (sekitar 24 menit) tidak bertambah dan tidak mendekati
  # batas 60 menit. Butuh Rust, sqlx-cli 0.9.1 dan Docker (db-ephemeral.sh: PostgreSQL sekali pakai; SeaweedFS
  # untuk test alur unggah penuh). Tidak butuh Node atau alat pemindai. Skrip verifikasi tidak diubah.
  # `apt-get install` hanya memakai nama paket tetap (tanpa masukan dari luar); versi paket dicocokkan dengan
  # SRC-980 (11.9.0 di noble) supaya perubahan versi paket tidak lolos diam-diam.
  test-qpdf:
    name: test qpdf asli (PDF, --ignored)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pasang paket qpdf (Ubuntu 24.04 noble, universe)
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends qpdf
          command -v qpdf
          qpdf --version
          dpkg-query --show --showformat='${Package} ${Version}\n' qpdf
          test "$(dpkg-query --show --showformat='${Version}' qpdf | cut -d- -f1)" = "11.9.0"

      - name: Pasang toolchain Rust sesuai rust-toolchain.toml
        run: |
          channel="$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | sed -n '1p')"
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy --no-self-update
          rustc --version

      - name: Pasang sqlx-cli 0.9.1 (crates.io, --locked)
        run: |
          root="$HOME/.local/share/ruang-sehat/sqlx-cli-0.9.1"
          cargo install sqlx-cli --version 0.9.1 --locked --no-default-features --features postgres,rustls --root "$root"
          test "$("$root/bin/sqlx" --version | sed -n '1p')" = "sqlx-cli 0.9.1"

      - name: Periksa Docker tersedia (db-ephemeral, SeaweedFS)
        run: |
          docker version
          docker info --format '{{.OperatingSystem}} {{.ServerVersion}}'

      - name: Periksa tidak ada konfigurasi cargo di luar repo
        run: bash scripts/ci/periksa-lingkungan-bersih.sh

      # Run 46093789597: test memakai QpdfConfig::new tanpa QpdfInspector::prepare, jadi direktori berkas sementara
      # bawaan (temp_dir/rs-pdf-inspect) tidak ada dan pemeriksa menjawab Unavailable. Itu cacat test (belum pernah
      # dijalankan, TD-48), bukan cacat qpdf; perbaikan benar adalah memanggil prepare di test (TD-65). Sementara,
      # direktori disiapkan di sini dengan izin 0700 seperti prepare, tanpa mengubah kode di luar kepemilikan task.
      - name: Siapkan direktori berkas sementara pemeriksa PDF (0700, seperti QpdfInspector::prepare)
        run: |
          install -d -m 700 "${TMPDIR:-/tmp}/rs-pdf-inspect"

      - name: cargo test corporate_documents_pdf_qpdf --ignored (qpdf asli)
        env:
          RS_TEST_QPDF: /usr/bin/qpdf
          SQLX_OFFLINE: "true"
        run: bash scripts/db-ephemeral.sh cargo test -p rs-backend --test corporate_documents_pdf_qpdf --locked -- --ignored --test-threads=1
