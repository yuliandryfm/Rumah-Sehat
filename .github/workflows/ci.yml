# CI Ruang Sehat (F1-T06; docs/05-stack.md §3.1–§3.2, §6; ADR-021 butir 4; KEPUTUSAN-81, KEPUTUSAN-82).
# Memverifikasi ulang di runner GitHub-hosted yang bersih: scripts/verify.sh lengkap (Rust, cargo-deny,
# cargo-audit, gitleaks, osv-scanner, dan langkah lain begitu diterapkan) lalu test skrip verifikasi itu sendiri.
#
# Aturan workflow ini:
# - Setiap action dipin ke SHA commit penuh dari repo resmi action, dengan tag sebagai komentar (SRC-354, SRC-355).
# - Alat dipasang dari rilis resmi dengan versi persis dan pemeriksaan SHA-256 (scripts/ci/pasang-alat.sh).
# - GITHUB_TOKEN hanya baca isi repo; tidak ada secret, tidak ada pull_request_target (SRC-355, SRC-356).
# - Tanpa cache: setiap jalan dimulai dari runner bersih supaya konfigurasi lokal tidak terbawa.

name: CI

on:
  push:
  pull_request:
    branches: [main]
  # Harian 23:00 UTC (06:00 WIB) di branch default: advisory baru terdeteksi walau tidak ada commit
  # (review F1-T06, non-blokir 4).
  schedule:
    - cron: "0 23 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: verify.sh (lingkungan bersih)
    runs-on: ubuntu-24.04
    # test-verify.sh menjalankan verify.sh lengkap (termasuk Docker) untuk setiap fixture.
    timeout-minutes: 60
    steps:
      - name: Checkout (riwayat penuh untuk gitleaks dan basis migrasi)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # scripts/db-migrations-check.sh mencari basis lewat `git merge-base HEAD main` atau
      # `tahap-08-fase-1` (ref lokal). Checkout hanya membuat branch lokal untuk ref yang dibangun; branch
      # lain tersedia sebagai origin/<nama>, jadi dibuatkan branch lokal (tanpa jaringan).
      - name: Siapkan ref basis migrasi (main, tahap-08-fase-1)
        run: |
          for b in main tahap-08-fase-1; do
            if ! git show-ref --verify --quiet "refs/heads/$b" && git show-ref --verify --quiet "refs/remotes/origin/$b"; then
              git branch "$b" "origin/$b"
            fi
          done
          git branch --list main tahap-08-fase-1

      - name: Pasang toolchain Rust sesuai rust-toolchain.toml
        run: |
          channel="$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | sed -n '1p')"
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy --no-self-update
          rustc --version

      - name: Pasang alat pemindai (versi persis, SHA-256 diperiksa)
        run: |
          bash scripts/ci/pasang-alat.sh "$RUNNER_TEMP/alat-ci"
          echo "$RUNNER_TEMP/alat-ci" >> "$GITHUB_PATH"

      # sqlx-cli 0.9.1 (SRC-182) untuk langkah migrasi-db, di lokasi yang dicari scripts/db-migrations-check.sh.
      # --locked memakai Cargo.lock rilis; setiap crate diperiksa checksum-nya terhadap indeks crates.io.
      - name: Pasang sqlx-cli 0.9.1 (crates.io, --locked)
        run: |
          root="$HOME/.local/share/ruang-sehat/sqlx-cli-0.9.1"
          cargo install sqlx-cli --version 0.9.1 --locked --no-default-features --features postgres,rustls --root "$root"
          test "$("$root/bin/sqlx" --version | sed -n '1p')" = "sqlx-cli 0.9.1"

      # Langkah bootstrap-role-db dan migrasi-db (kontainer PostgreSQL sekali pakai) serta schemathesis (image
      # Docker dengan --network host) di verify.sh butuh Docker. Docker Engine sudah terpasang di image
      # ubuntu-24.04 (SRC-357); di sini dipastikan daemon berjalan sebelum verify.sh.
      - name: Periksa Docker tersedia (bootstrap-role-db, migrasi-db, schemathesis)
        run: |
          docker version
          docker info --format '{{.OperatingSystem}} {{.ServerVersion}}'

      - name: Periksa tidak ada konfigurasi cargo di luar repo
        run: bash scripts/ci/periksa-lingkungan-bersih.sh

      - name: scripts/verify.sh
        run: bash scripts/verify.sh

      - name: Test skrip verifikasi (fixture merah harus MERAH)
        run: bash scripts/test/test-verify.sh
