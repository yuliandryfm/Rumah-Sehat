<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pasien 2/19 Daftar - Prototipe Ruang Sehat</title><link rel="stylesheet" href="../assets/prototype.css"></head><body>
<div class="pbar"><a href="../index.html">&larr; Indeks</a><b>Aplikasi Pasien &middot; 2/19 Daftar</b><span class="pnote">Prototipe tampilan, belum terhubung sistem</span><span class="pnav"><a href="01-pembuka.html">Sebelumnya</a><a href="03-periksa-email.html">Berikutnya</a></span></div>
<main class="stage"><div class="phone">
<div class="sb"><span>09.41</span><span></span></div>
<div class="appbar"><a class="icon-btn" href="01-pembuka.html" aria-label="Kembali">&larr;</a><h2>Buat akun</h2></div>
<form class="phone-body" action="03-periksa-email.html">
  <div class="field"><label for="nm">Nama lengkap</label><input id="nm" class="input" value="Pasien Contoh" autocomplete="name"></div>
  <div class="field"><label for="em">Email</label><input id="em" class="input" type="email" value="pasien.contoh@example.test" autocomplete="email"></div>
  <div class="field"><label for="hp">Nomor ponsel</label><input id="hp" class="input" type="tel" value="0812 0000 0000" autocomplete="tel"></div>
  <div class="field"><label for="pw">Password</label><input id="pw" class="input" type="password" value="contohpassword" autocomplete="new-password"><span class="hint">Boleh ditempel dari pengelola password. Aturan password final mengikuti NFR-SEC-03.</span></div>
  <p class="t-cap">Tanpa masuk lewat Google atau Apple.</p>
  <button class="btn btn-primary btn-block" type="submit">Daftar</button>
  <p class="t-small">Sudah punya akun? <a href="05-mfa.html">Masuk</a></p>
</form>
</div></main></body></html>
