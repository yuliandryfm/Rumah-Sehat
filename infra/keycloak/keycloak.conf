# Konfigurasi server Keycloak 26.8.2 bersama semua lingkungan (F1-T31). Tidak berisi rahasia.
# Dipasang baca-saja ke /opt/keycloak/conf/keycloak.conf oleh infra/local/compose.yaml dan
# scripts/keycloak-check.sh. Format berkas: <key-with-dashes>=<value>, berlaku juga untuk opsi SPI.
#
# Parameter Argon2 (ADR-011 butir 4, KEPUTUSAN-85): minimal setara OWASP Password Storage Cheat Sheet
# (19 MiB, 2 iterasi, paralelisme 1, SRC-49). Satuan `memory` adalah KB ("Memory size (KB)") dan
# bawaannya 7168 KB / 5 iterasi / paralelisme 1 (kode sumber Argon2PasswordHashProviderFactory dan
# Argon2Parameters tag 26.8.2). 19 MiB = 19456 KiB. Nilai yang benar-benar dipakai diperiksa
# scripts/keycloak-check.sh dari data kredensial user uji (Admin REST).
spi-password-hashing--argon2--memory=19456
spi-password-hashing--argon2--iterations=2
spi-password-hashing--argon2--parallelism=1
