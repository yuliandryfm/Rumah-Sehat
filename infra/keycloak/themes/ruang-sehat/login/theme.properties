# Tema login Ruang Sehat (F1-T35). Memperluas tema bawaan keycloak.v2: hanya login.ftl, stylesheet, dan pesan
# sendiri. Semua sumber daya disajikan Keycloak sendiri: tanpa skrip, font, atau aset pihak ketiga
# (font sistem, KEPUTUSAN-164).
parent=keycloak.v2
locales=id
# Mode gelap tidak ada di rilis 1 (tokens.css).
darkMode=false
# tokens.css = salinan persis web/packages/ui/src/tokens.css (dijaga keycloak_check.py).
styles=css/styles.css css/tokens.css css/ruang-sehat.css
