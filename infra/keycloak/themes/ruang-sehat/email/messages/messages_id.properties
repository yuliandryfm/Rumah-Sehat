# Pesan email Ruang Sehat (TD-27, US-103 AC4d, KEPUTUSAN-200). Kunci yang tidak ada di sini jatuh ke terjemahan
# bawaan Keycloak.
#
# Email pemberitahuan setelah password diatur ulang atau diubah (listener event `email` Keycloak, hanya event
# UPDATE_PASSWORD; keycloak.conf). Templat bawaan event-update_password.ftl memberi {0} = waktu dan {1} = alamat IP;
# keduanya sengaja tidak dipakai: waktu diformat zona JVM (bukan WIB) dan alamat IP tidak perlu dikirim lewat email.
# Tanpa tautan, tanpa nama, tanpa data akun selain alamat penerima.
# DRAF: teks belum ditetapkan PRD; kontak Layanan Pelanggan final [TIDAK DIKETAHUI] (tanpa nomor atau alamat).
eventUpdatePasswordSubject=Password akun Ruang Sehat Anda telah diubah
eventUpdatePasswordBody=Password akun Ruang Sehat Anda baru saja diatur ulang atau diubah. Bila Anda yang melakukannya, abaikan email ini.\n\nBila bukan Anda, segera atur ulang password lewat Lupa password di halaman masuk aplikasi Ruang Sehat dan hubungi Layanan Pelanggan Ruang Sehat.
eventUpdatePasswordBodyHtml=<p>Password akun Ruang Sehat Anda baru saja diatur ulang atau diubah. Bila Anda yang melakukannya, abaikan email ini.</p><p>Bila bukan Anda, segera atur ulang password lewat Lupa password di halaman masuk aplikasi Ruang Sehat dan hubungi Layanan Pelanggan Ruang Sehat.</p>
