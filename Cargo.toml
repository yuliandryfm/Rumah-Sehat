# Workspace Cargo tunggal untuk backend Ruang Sehat, RME minimalis, dan pustaka bersama
# (KEPUTUSAN-74, KEPUTUSAN-89; struktur di docs/coding-standards.md §1.1).
# Anggota memakai glob supaya setiap crate baru di apps/ atau crates/ otomatis dikompilasi dan dites (review keamanan F1-T05, non-blokir 1).
[workspace]
resolver = "3"
members = ["apps/*", "crates/*"]

# Larangan berlaku untuk SELURUH workspace (F1-T12, coding-standards §3.4, §5.7, §6).
# Setiap crate wajib `[lints] workspace = true` dan tidak boleh punya [lints.*] atau clippy.toml sendiri;
# crate `arch-check` (test arsitektur) memeriksa hal itu. Nilai konfigurasinya ada di clippy.toml root.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
dbg_macro = "deny"
disallowed_methods = "deny"

# KEPUTUSAN-295: profil dev/test ringan untuk menghemat disk mesin pengembangan
# (worktree agent paralel). Crate workspace menyimpan tabel baris saja (backtrace
# tetap bernomor baris); dependensi tanpa info debug. Tidak memengaruhi build
# rilis maupun isi test.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
